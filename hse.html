<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commerce - Political Science Students</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #faf3eb;
  color: #2c1f14;
  padding: 24px;
  min-height: 100vh;
}
.container { max-width: 1320px; margin: 0 auto; }

/* HEADER */
.header {
  background: linear-gradient(145deg, #c97e35, #b06a2a, #9a5c24);
  padding: 28px 32px;
  border-radius: 16px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(180, 100, 30, 0.2);
}
.header h1 {
  font-family: 'Merriweather', serif;
  font-size: 1.5rem;
  color: #fef7f0;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.header p {
  font-size: 0.85rem;
  color: #f0dfcc;
  margin-top: 6px;
  font-weight: 300;
}

/* STATS */
.stats-row {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.stat-box {
  background: #fffcf7;
  padding: 14px 22px;
  border-radius: 12px;
  flex: 1;
  min-width: 120px;
  border: 1px solid #e6d5c2;
  box-shadow: 0 2px 8px rgba(140, 90, 40, 0.06);
}
.stat-box .label {
  font-size: 0.72rem;
  color: #8c7a68;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  font-weight: 500;
}
.stat-box .value {
  font-size: 1.5rem;
  font-weight: 700;
  margin-top: 2px;
}
.stat-box .value.earthy { color: #9a5c24; }
.stat-box .value.green { color: #2e7d32; }
.stat-box .value.red { color: #c62828; }

/* TOOLBAR */
.toolbar {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  align-items: center;
}
.search-input {
  flex: 1;
  min-width: 220px;
  padding: 11px 16px;
  border: 2px solid #e6d5c2;
  border-radius: 10px;
  font-size: 0.88rem;
  background: #fffcf7;
  color: #2c1f14;
  transition: all 0.2s;
}
.search-input:focus {
  outline: none;
  border-color: #c97e35;
  box-shadow: 0 0 0 3px rgba(201, 126, 53, 0.12);
}
.search-input::placeholder { color: #a69480; }
.filter-select {
  padding: 11px 16px;
  border: 2px solid #e6d5c2;
  border-radius: 10px;
  font-size: 0.82rem;
  background: #fffcf7;
  color: #2c1f14;
  font-weight: 500;
  cursor: pointer;
}
.filter-select:focus { outline: none; border-color: #c97e35; }
.btn-pdf {
  padding: 11px 26px;
  background: linear-gradient(145deg, #c97e35, #b06a2a);
  color: #fef7f0;
  border: none;
  border-radius: 10px;
  font-size: 0.84rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(180, 100, 30, 0.2);
  white-space: nowrap;
}
.btn-pdf:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(180, 100, 30, 0.3); }

/* GRID */
.student-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 20px;
}

/* CARD */
.student-card {
  background: #fffcf7;
  border-radius: 16px;
  border: 1px solid #e6d5c2;
  box-shadow: 0 3px 14px rgba(140, 90, 40, 0.07);
  overflow: hidden;
  transition: all 0.25s ease;
}
.student-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 32px rgba(140, 90, 40, 0.12);
}

/* CARD TOP */
.card-top {
  background: linear-gradient(135deg, #f2e6d9, #e8d9c8);
  padding: 12px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #e0cebb;
}
.card-top .reg-number {
  font-family: 'Courier New', monospace;
  font-size: 0.72rem;
  color: #7a6856;
  font-weight: 600;
}
.result-tag {
  padding: 3px 14px;
  border-radius: 20px;
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.result-tag.ehs {
  background: #e6f4ea;
  color: #2e7d32;
  border: 1px solid #a5d6a7;
}
.result-tag.nhs {
  background: #fce8e6;
  color: #b71c1c;
  border: 1px solid #ef9a9a;
}

/* CARD BODY */
.card-body { padding: 16px 18px; }
.student-name {
  font-family: 'Merriweather', serif;
  font-size: 1.02rem;
  color: #2c1f14;
  margin-bottom: 1px;
}
.student-group {
  font-size: 0.73rem;
  color: #8c7a68;
  margin-bottom: 10px;
}

/* PERCENTAGE BAR */
.percent-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  padding: 8px 12px;
  background: #f8f0e8;
  border-radius: 8px;
  border: 1px solid #e6d5c2;
}
.percent-label {
  font-size: 0.72rem;
  color: #7a6856;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  white-space: nowrap;
}
.percent-value {
  font-size: 1.1rem;
  font-weight: 700;
  color: #9a5c24;
  min-width: 48px;
}
.percent-bar-bg {
  flex: 1;
  height: 6px;
  background: #e6d5c2;
  border-radius: 3px;
  overflow: hidden;
  min-width: 60px;
}
.percent-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.4s ease;
}
.percent-bar-fill.high { background: linear-gradient(90deg, #2e7d32, #43a047); }
.percent-bar-fill.medium { background: linear-gradient(90deg, #b8732e, #d4893a); }
.percent-bar-fill.low { background: linear-gradient(90deg, #c62828, #e53935); }

/* SUBJECT TABLE */
.subj-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.78rem;
}
.subj-table th {
  text-align: left;
  font-weight: 600;
  color: #7a6856;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  padding: 5px 6px;
  border-bottom: 1px solid #e6d5c2;
}
.subj-table th:last-child,
.subj-table td:last-child {
  text-align: right;
}
.subj-table th:nth-child(2),
.subj-table th:nth-child(3),
.subj-table th:nth-child(4),
.subj-table td:nth-child(2),
.subj-table td:nth-child(3),
.subj-table td:nth-child(4) {
  text-align: center;
}
.subj-table td {
  padding: 5px 6px;
  border-bottom: 1px solid #f0e6dc;
  vertical-align: middle;
}
.subj-table tr:last-child td {
  border-bottom: none;
}
.subj-table .subj-name {
  font-weight: 500;
  color: #5a4a38;
}
.subj-table .highlight-row {
  background: #fcf1e6;
}
.subj-table .highlight-row .subj-name {
  color: #9a5c24;
  font-weight: 600;
}
.subj-grades {
  font-weight: 600;
  font-size: 0.76rem;
}

/* GRADE COLORS */
.grade-A-plus { color: #1b5e20; }
.grade-A { color: #2e7d32; }
.grade-B-plus { color: #558b2f; }
.grade-B { color: #6d4c00; }
.grade-C-plus { color: #b8732e; }
.grade-C { color: #d84315; }
.grade-D-plus { color: #c62828; }
.grade-D { color: #b71c1c; }
.grade-Ab { color: #a69480; font-style: italic; }

/* CARD FOOTER */
.card-footer {
  padding: 10px 18px 14px;
  border-top: 1px solid #e6d5c2;
  display: flex;
  justify-content: flex-end;
}
.btn-save-card {
  padding: 7px 18px;
  background: transparent;
  border: 1.5px solid #c97e35;
  border-radius: 8px;
  color: #9a5c24;
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-save-card:hover {
  background: #c97e35;
  color: #fef7f0;
}

/* EMPTY */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #a69480;
  font-size: 0.95rem;
  display: none;
  grid-column: 1 / -1;
}

/* TOAST */
.toast-msg {
  position: fixed;
  bottom: 28px;
  right: 28px;
  background: #2c1f14;
  color: #fef7f0;
  padding: 12px 22px;
  border-radius: 10px;
  font-size: 0.82rem;
  font-weight: 500;
  box-shadow: 0 6px 28px rgba(0,0,0,0.18);
  opacity: 0;
  transform: translateY(16px);
  transition: all 0.3s ease;
  pointer-events: none;
  z-index: 999;
}
.toast-msg.visible { opacity: 1; transform: translateY(0); }

@media (max-width: 640px) {
  body { padding: 14px; }
  .header { padding: 18px 20px; }
  .header h1 { font-size: 1.1rem; }
  .student-grid { grid-template-columns: 1fr; }
  .toolbar { flex-direction: column; }
  .search-input { min-width: 100%; }
  .stat-box { min-width: 80px; padding: 10px 14px; }
}
@media print {
  body { background: #fff; padding: 0; }
  .toolbar, .card-footer, .btn-pdf, .btn-save-card { display: none !important; }
  .student-card { break-inside: avoid; border: 1px solid #ccc; box-shadow: none; }
  .header { border-radius: 0; }
}
</style>

// ========== STATE ==========
const MAX_TOTAL = 1200;
let students = RAW_DATA.d;

// ========== UTILITY ==========
function gradeClass(g) {
  if (g === 'A+') return 'grade-A-plus';
  if (g === "A ") return 'grade-A';
  if (g === 'B+') return 'grade-B-plus';
  if (g === "B ") return 'grade-B';
  if (g === "C+") return 'grade-C-plus';
  if (g === "C ") return 'grade-C';
  if (g === 'D+') return 'grade-D-plus';
  if (g === "D ") return 'grade-D';
  if (g === 'Ab') return 'grade-Ab';
  return '';
}

function calcPercentage(st) {
  let total = 0;
  let hasAllAbsent = true;
  for (const s of st.s) {
    const t = s[3];
    if (t !== null && t !== undefined && t !== 'Ab' && t !== '-') {
      total += Number(t);
      hasAllAbsent = false;
    }
  }
  if (hasAllAbsent) return { total: 0, pct: 0, valid: false };
  return { total, pct: (total / MAX_TOTAL) * 100, valid: true };
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 2200);
}

// ========== RENDER ==========
function renderCards() {
  const query = document.getElementById('searchBox').value.toLowerCase().trim();
  const resultFilter = document.getElementById('resultFilter').value;
  const gradeFilter = document.getElementById('gradeFilter').value;

  const filtered = students.filter(st => {
    if (resultFilter !== 'all' && st.re !== resultFilter) return false;
    const ps = st.s.find(s => s[0] === 'POLITICAL SCIENCE');
    if (gradeFilter !== 'all') {
      if (!ps || ps[4] !== gradeFilter) return false;
    }
    if (query) {
      const nameMatch = st.n.toLowerCase().includes(query);
      const regMatch = String(st.r).includes(query);
      const subjMatch = st.s.some(s => s[0].toLowerCase().includes(query));
      if (!nameMatch && !regMatch && !subjMatch) return false;
    }
    return true;
  });

  document.getElementById('statTotal').textContent = students.length;
  document.getElementById('statEHS').textContent = students.filter(s => s.re === 'EHS').length;
  document.getElementById('statNHS').textContent = students.filter(s => s.re === 'NHS').length;

  const grid = document.getElementById('cardGrid');
  const empty = document.getElementById('emptyMsg');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  let html = '';
  for (const st of filtered) {
    const { total, pct, valid } = calcPercentage(st);
    const pctFormatted = valid ? pct.toFixed(1) : '--';
    const barClass = !valid ? '' : pct >= 60 ? 'high' : pct >= 35 ? 'medium' : 'low';
    const barWidth = valid ? Math.min(pct, 100) : 0;

    let rows = '';
    for (const subj of st.s) {
      const isPS = subj[0] === 'POLITICAL SCIENCE';
      const ce = subj[1] !== null && subj[1] !== undefined ? subj[1] : '-';
      const te = subj[2] !== null && subj[2] !== undefined ? subj[2] : '-';
      const t = subj[3] !== null && subj[3] !== undefined ? subj[3] : '-';
      const grade = subj[4];
      const highlight = isPS ? 'highlight-row' : '';
      rows += `<tr class="${highlight}">
        <td class="subj-name">${subj[0]}</td>
        <td>${ce}</td>
        <td>${te}</td>
        <td>${t}</td>
        <td class="subj-grades ${gradeClass(grade)}">${grade}</td>
      </tr>`;
    }

    html += `
<div class="student-card">
  <div class="card-top">
    <span class="reg-number">${st.r}</span>
    <span class="result-tag ${st.re === 'EHS' ? 'ehs' : 'nhs'}">${st.re === 'EHS' ? 'Eligible' : 'Not Eligible'}</span>
  </div>
  <div class="card-body">
    <div class="student-name">${st.n}</div>
    <div class="student-group">${st.g}</div>
    <div class="percent-row">
      <span class="percent-label">Total</span>
      <span class="percent-value">${valid ? total : '--'}/1200</span>
      <span class="percent-label">${pctFormatted}%</span>
      <div class="percent-bar-bg">
        <div class="percent-bar-fill ${barClass}" style="width:${barWidth}%"></div>
      </div>
    </div>
    <table class="subj-table">
      <thead>
        <tr>
          <th>Subject</th>
          <th>CE</th>
          <th>TE</th>
          <th>Total</th>
          <th>Grade</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
  <div class="card-footer">
    <button class="btn-save-card" onclick="saveCardAsImage(this, '${st.r}')">Save as Image</button>
  </div>
</div>`;
  }

  grid.innerHTML = html;
}

// ========== SAVE CARD AS IMAGE ==========
function saveCardAsImage(btn, regNo) {
  const card = btn.closest('.student-card');
  html2canvas(card, {
    scale: 2.5,
    backgroundColor: '#fffcf7',
    useCORS: true,
    logging: false
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = `student_${regNo}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('Saved: ' + regNo);
  }).catch(() => {
    showToast('Error saving image');
  });
}

// ========== DOWNLOAD ALL AS PDF ==========
function downloadAllPDF() {
  const cards = document.querySelectorAll('.student-card');
  if (cards.length === 0) { showToast('No cards to download'); return; }

  showToast('Generating PDF...');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  const pageW = 210;
  const pageH = 297;
  let yPos = 10;

  pdf.setFontSize(13);
  pdf.setTextColor(154, 92, 36);
  pdf.text('Commerce - Political Science Students', 105, 18, { align: 'center' });
  pdf.setFontSize(9);
  pdf.setTextColor(100, 80, 60);
  pdf.text('10030-GOVT HSS, VELLIYODE, KOZHIKKODE  |  HSE Second Year March 2026', 105, 25, { align: 'center' });
  yPos = 32;

  const renderPromises = [];
  cards.forEach(card => {
    renderPromises.push(
      html2canvas(card, {
        scale: 2,
        backgroundColor: '#fffcf7',
        useCORS: true,
        logging: false
      })
    );
  });

  Promise.all(renderPromises).then(canvases => {
    canvases.forEach((canvas) => {
      const imgData = canvas.toDataURL('image/png');
      const imgW = pageW - 18;
      const imgH = (canvas.height / canvas.width) * imgW;

      if (yPos + imgH > pageH - 12) {
        pdf.addPage();
        yPos = 10;
      }

      pdf.addImage(imgData, 'PNG', 9, yPos, imgW, imgH);
      yPos += imgH + 6;
    });

    pdf.save('commerce_political_science_students.pdf');
    showToast('PDF downloaded successfully');
  }).catch(() => {
    showToast('Error generating PDF');
  });
}

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', renderCards);
