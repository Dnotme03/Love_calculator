<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Perfume Dashboard</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}

h1{
text-align:center;
}

button{
padding:10px 20px;
background:#22c55e;
border:none;
color:white;
font-size:16px;
cursor:pointer;
border-radius:5px;
margin-bottom:20px;
}

button:hover{
background:#16a34a;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
padding:10px;
border:1px solid #334155;
text-align:center;
}

th{
background:#1e293b;
}

tr:nth-child(even){
background:#1e293b;
}
</style>

</head>

<body>

<h1>Perfume Product Dashboard</h1>

<button onclick="loadProducts()">Refresh Data</button>

<table>

<thead>
<tr>
<th>Product</th>
<th>Size</th>
<th>Price</th>
<th>Offer Price</th>
<th>Stock</th>
<th>Units Sold</th>
<th>Revenue</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

<script>

async function loadProducts(){

try{

const res = await fetch("https://lofo-perfumes-server.vercel.app/api/products")

const data = await res.json()

const table = document.getElementById("table")
table.innerHTML=""

data.products.forEach(p=>{

const s = p.sizeOptions[0]

table.innerHTML += `
<tr>
<td>${p.name}</td>
<td>${s.size}</td>
<td>${s.price}</td>
<td>${s.offerPrice}</td>
<td>${s.stock}</td>
<td>${p.salesReport.unitsSold}</td>
<td>${p.salesReport.revenueGenerated}</td>
</tr>
`

})

}catch(e){

alert("API fetch failed. Check browser console.")

console.log(e)

}

}

</script>

</body>
</html>
