<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Perfume Dashboard</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}

button{
padding:10px 20px;
background:#22c55e;
border:none;
color:white;
cursor:pointer;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #334155;
padding:10px;
text-align:center;
}

th{
background:#1e293b;
}

tr:nth-child(even){
background:#1e293b;
}
</style>

</head>

<body>

<h2>Perfume Dashboard</h2>

<button onclick="load()">Refresh</button>

<table>

<thead>
<tr>
<th>Product</th>
<th>Price</th>
<th>Offer</th>
<th>Stock</th>
<th>Sold</th>
<th>Revenue</th>
</tr>
</thead>

<tbody id="data"></tbody>

</table>

<script>

async function load(){

const res = await fetch("api.php")
const d = await res.json()

const tbody = document.getElementById("data")

tbody.innerHTML=""

d.products.forEach(p=>{

const s = p.sizeOptions[0]

tbody.innerHTML += `
<tr>
<td>${p.name}</td>
<td>${s.price}</td>
<td>${s.offerPrice}</td>
<td>${s.stock}</td>
<td>${p.salesReport.unitsSold}</td>
<td>${p.salesReport.revenueGenerated}</td>
</tr>
`

})

}

</script>

</body>
</html>
