<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for you</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:'Inter',sans-serif;
background:linear-gradient(135deg,#1a0a12,#2d0f1a,#1a0a12);
overflow:hidden;
position:relative
}
.btn-row{
    display:flex;
    gap:24px;
    justify-content:center;
    align-items:center;
    position:relative;
    min-height:70px;
}

.btn-yes{
    position:relative;
    z-index:3;
}

.btn-no{
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.1);
color:rgba(255,200,215,.65);
box-shadow:0 4px 16px rgba(0,0,0,.2);
min-width:120px;
position:relative;
z-index:2;
will-change:transform,left,top
}
.glow{
position:fixed;
border-radius:50%;
filter:blur(140px);
pointer-events:none;
z-index:0
}
.g1{width:600px;height:600px;background:rgba(255,60,120,.15);top:-200px;left:-200px}
.g2{width:500px;height:500px;background:rgba(255,40,100,.10);bottom:-180px;right:-180px}
.g3{width:350px;height:350px;background:rgba(255,150,180,.08);top:50%;left:50%;transform:translate(-50%,-50%)}
.particles{
position:fixed;
inset:0;
pointer-events:none;
z-index:0;
overflow:hidden
}
.p{
position:absolute;
border-radius:50%;
background:rgba(255,180,200,.06);
animation:drift linear infinite
}
@keyframes drift{
0%{transform:translateY(100vh) scale(0);opacity:0}
15%{opacity:1}
85%{opacity:1}
100%{transform:translateY(-10vh) scale(1);opacity:0}
}
.wrap{
position:relative;
z-index:1;
width:100%;
max-width:540px;
padding:20px
}
.card{
background:rgba(255,220,230,.04);
backdrop-filter:blur(30px) saturate(1.3);
-webkit-backdrop-filter:blur(30px) saturate(1.3);
border:1px solid rgba(255,120,160,.12);
border-radius:36px;
padding:44px 36px 36px;
box-shadow:0 40px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,180,200,.08);
text-align:center;
position:relative;
overflow:hidden
}
.card::after{
content:'';
position:absolute;
top:0;left:-60%;
width:220%;height:1px;
background:linear-gradient(90deg,transparent,rgba(255,180,200,.15),transparent);
animation:shine 5s ease-in-out infinite
}
@keyframes shine{
0%,100%{transform:translateX(-60%)}
50%{transform:translateX(60%)}
}
.step{display:none}
.step.active{display:block;animation:rise .5s cubic-bezier(.22,1,.36,1)}
@keyframes rise{
0%{opacity:0;transform:translateY(24px) scale(.97)}
100%{opacity:1;transform:translateY(0) scale(1)}
}
.main{
font-family:'Playfair Display',serif;
font-size:2.3rem;
font-weight:700;
color:#fce4ec;
line-height:1.25;
letter-spacing:-.02em;
margin-bottom:6px
}
.main .accent{color:#ff6b93}
.sub{
font-size:.9rem;
font-weight:300;
color:rgba(255,200,215,.5);
letter-spacing:.3px;
margin-bottom:30px
}
.quote{
font-family:'Playfair Display',serif;
font-style:italic;
font-weight:400;
font-size:1.05rem;
color:rgba(255,180,200,.7);
min-height:1.6em;
margin-bottom:26px;
transition:color .4s
}
.sticker-row{
display:flex;
justify-content:center;
gap:12px;
margin-bottom:30px;
flex-wrap:wrap
}
.sticker-row video{
width:76px;
height:76px;
border-radius:16px;
object-fit:cover;
box-shadow:none;
border:none;
outline:none;
transition:transform .3s ease
}
.sticker-row video:hover{transform:scale(1.06)}
.btn{
display:inline-flex;
align-items:center;
justify-content:center;
padding:15px 44px;
border:none;
border-radius:60px;
font-family:'Inter',sans-serif;
font-size:.95rem;
font-weight:500;
cursor:pointer;
transition:all .3s cubic-bezier(.22,1,.36,1);
letter-spacing:.3px;
-webkit-tap-highlight-color:transparent
}
.btn:active{transform:scale(.96)}
.btn-primary{
background:rgba(255,120,160,.12);
backdrop-filter:blur(8px);
border:1px solid rgba(255,120,160,.2);
color:#fce4ec;
box-shadow:0 4px 20px rgba(255,60,120,.15)
}
.btn-primary:hover{
background:rgba(255,120,160,.22);
transform:translateY(-2px);
box-shadow:0 8px 32px rgba(255,60,120,.25)
}
.btn-yes{
background:rgba(255,80,130,.18);
border:1px solid rgba(255,80,130,.3);
color:#fff;
box-shadow:0 4px 24px rgba(255,60,120,.2);
min-width:120px;
font-weight:500;
position:relative;
z-index:3
}
.btn-yes:hover{
background:rgba(255,80,130,.3);
transform:translateY(-2px);
box-shadow:0 8px 36px rgba(255,60,120,.3)
}
.btn-no{
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.1);
color:rgba(255,200,215,.65);
box-shadow:0 4px 16px rgba(0,0,0,.2);
min-width:120px;
z-index:2;
will-change:transform,left,top
}
.btn-no:hover{
background:rgba(255,255,255,.08);
color:#fce4ec
}
.btn-row{
display:flex;
gap:24px;
justify-content:center;
align-items:center;
position:relative;
min-height:70px;
margin-top:4px
}
.btn-row .btn-yes{flex-shrink:0}
.final-sub{
font-size:1.1rem;
font-weight:300;
color:rgba(255,200,215,.65);
margin-top:4px;
letter-spacing:.2px
}
.heart{
position:fixed;
pointer-events:none;
z-index:100;
animation:burst 3s ease-out forwards;
font-size:2rem
}
@keyframes burst{
0%{opacity:1;transform:translateY(0) scale(.4) rotate(0)}
100%{opacity:0;transform:translateY(-500px) scale(1.8) rotate(25deg)}
}
.spark{
position:fixed;
width:4px;height:4px;
border-radius:50%;
pointer-events:none;
z-index:99;
animation:sparkOut 1.6s ease-out forwards
}
@keyframes sparkOut{
0%{opacity:1;transform:scale(0)}
60%{opacity:1;transform:scale(1.6)}
100%{opacity:0;transform:scale(0) translateY(-60px)}
}
@media(max-width:500px){
.card{padding:34px 20px 28px;border-radius:28px}
.main{font-size:1.8rem}
.sticker-row video{width:64px;height:64px}
.btn{padding:13px 28px;font-size:.85rem}
.btn-row{gap:14px;min-height:64px}
}
</style>
</head>
<body>

<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="glow g3"></div>
<div class="particles" id="particles"></div>

<div class="wrap">
<div class="card">
<div class="step active" id="s1">
<div class="main">I've to ask you <span class="accent">something</span></div>
<div class="sub">(it's been on my mind)</div>
<button class="btn btn-primary" onclick="next()">Oky</button>
</div>

<div class="step" id="s2">
<div class="sticker-row">
<video src="https://files.catbox.moe/md2vt4.mp4" autoplay loop muted playsinline></video>
<video src="https://files.catbox.moe/md2vt4.mp4" autoplay loop muted playsinline></video>
<video src="https://files.catbox.moe/md2vt4.mp4" autoplay loop muted playsinline></video>
</div>
<div class="main">Will you be mine <span class="accent">forever</span>?</div>
<div class="quote" id="quote">my heart skips a beat just thinking about you</div>
<div class="btn-row" id="btnRow">
<button class="btn btn-yes" onclick="sayYes()">Yes</button>
<button class="btn btn-no" id="noBtn" onclick="sayNo(this)">No</button>
</div>
</div>

<div class="step" id="s3">
<div class="sticker-row">
<video src="https://files.catbox.moe/0nm7b2.mp4" autoplay loop muted playsinline></video>
<video src="https://files.catbox.moe/0nm7b2.mp4" autoplay loop muted playsinline></video>
<video src="https://files.catbox.moe/0nm7b2.mp4" autoplay loop muted playsinline></video>
</div>
<div class="main">aww, I knew it <span class="accent">♡</span></div>
<div class="sub final-sub">you know … I really like you</div>
</div>
</div>
</div>

<script>
(()=>{
const c=document.getElementById('particles');
for(let i=50;i--;){
const p=document.createElement('div');
p.className='p';
const s=Math.random()*5+2;
p.style.width=s+'px';p.style.height=s+'px';
p.style.left=Math.random()*100+'%';
p.style.animationDuration=(Math.random()*14+10)+'s';
p.style.animationDelay=(Math.random()*14)+'s';
c.appendChild(p)
}
})();

let noClicks=0;
const quotes=[
'my heart skips a beat just thinking about you',
'are you sure? i can do this all day',
'c’mon … you know you want to',
'one more try — for luck',
'okay but … really really sure?',
'i have infinite patience, just saying'
];

function next(){
document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
document.getElementById('s2').classList.add('active');
}

function sayNo(btn){
noClicks++;
document.getElementById('quote').textContent=quotes[Math.min(noClicks-1,quotes.length-1)];

if(noClicks===1){
document.querySelectorAll('#s2 .sticker-row video').forEach(v=>{v.src='https://files.catbox.moe/vmfrdv.mp4';v.play()});
}

const row=document.getElementById('btnRow');
const r=row.getBoundingClientRect();
const b=btn.getBoundingClientRect();
const yes=document.querySelector('.btn-yes');
const yb=yes.getBoundingClientRect();
const pad=4;
const maxW=r.width-b.width-pad*2;
const maxH=r.height-b.height-pad*2;

let nx,ny,ok=false;
for(let i=0;i<200;i++){
nx=Math.random()*maxW;
ny=Math.random()*maxH;

const newLeft = pad + nx;
const newTop = pad + ny;

const yesLeft = yb.left - r.left;
const yesTop = yb.top - r.top;

const overlap =
    newLeft < yesLeft + yb.width + 20 &&
    newLeft + b.width + 20 > yesLeft &&
    newTop < yesTop + yb.height + 20 &&
    newTop + b.height + 20 > yesTop;

const moveDist = Math.hypot(
    nx - (b.left - r.left - pad),
    ny - (b.top - r.top - pad)
);

if(!overlap && moveDist > 30 + noClicks * 10){
    ok = true;
    break;
}
}
if(!ok){nx=Math.random()*maxW;ny=Math.random()*maxH}

if(noClicks===1){
    btn.style.position='absolute';
}

btn.style.left=(pad+nx)+'px';
btn.style.top=(pad+ny)+'px';

for(let i=6;i--;){
const s=document.createElement('div');
s.className='spark';
s.style.left=(b.left+Math.random()*b.width)+'px';
s.style.top=(b.top+Math.random()*b.height)+'px';
s.style.background=`hsl(${340+Math.random()*40},80%,${70+Math.random()*25}%)`;
document.body.appendChild(s);
setTimeout(()=>s.remove(),1600)
}
}

function sayYes(){
document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
document.getElementById('s3').classList.add('active');

const emojis=['♡','♥','💕','✨','🌸','💫'];
for(let i=30;i--;){
setTimeout(()=>{
const h=document.createElement('div');
h.className='heart';
h.textContent=emojis[Math.floor(Math.random()*emojis.length)];
h.style.left=(window.innerWidth*.1+Math.random()*.8*window.innerWidth)+'px';
h.style.bottom='0';
document.body.appendChild(h);
setTimeout(()=>h.remove(),3000)
},i*70)
}
for(let i=18;i--;){
setTimeout(()=>{
const s=document.createElement('div');
s.className='spark';
s.style.left=Math.random()*window.innerWidth+'px';
s.style.top=Math.random()*window.innerHeight+'px';
s.style.background=`hsl(${320+Math.random()*60},90%,80%)`;
s.style.width=(3+Math.random()*4)+'px';
s.style.height=s.style.width;
document.body.appendChild(s);
setTimeout(()=>s.remove(),1600)
},i*90)
}
}

window.addEventListener('resize',()=>{
const n=document.getElementById('noBtn');
if(n.style.position==='absolute'){
n.style.position='relative';
n.style.left='auto';
n.style.top='auto'
}
});
</script>
</body>
  </html>
